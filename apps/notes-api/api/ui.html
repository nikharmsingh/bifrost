<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <meta name="description" content="Browse and edit notes stored in Neon Postgres.">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c; --border: #262626; --focus: #6366f1;
      --text: #e5e5e5; --muted: #8a8a8a; --faint: #525252; --accent: #818cf8; --accent-2: #a78bfa;
      --ok: #4ade80; --ok-bg: rgba(74, 222, 128, .12); --bad: #f87171; --bad-bg: rgba(248, 113, 113, .12);
      --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .12); --selected: rgba(99, 102, 241, .14);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --border: #e4e4e7; --focus: #6366f1;
        --text: #18181b; --muted: #52525b; --faint: #a1a1aa; --accent: #4f46e5; --accent-2: #7c3aed;
        --ok: #15803d; --ok-bg: rgba(21, 128, 61, .08); --bad: #b91c1c; --bad-bg: rgba(185, 28, 28, .08);
        --warn: #b45309; --warn-bg: rgba(180, 83, 9, .08); --selected: rgba(79, 70, 229, .08);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 16px; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1080px; margin: 0 auto; }
    .back { font-size: .85rem; color: var(--muted); }
    header { margin: 12px 0 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; background: linear-gradient(135deg, #6366f1, var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
    .tagline { color: var(--muted); margin-top: 2px; }

    input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; font-size: .9rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--focus); }
    input { padding: 8px 12px; }
    button { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap; }
    button:hover:not(:disabled) { border-color: var(--focus); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: linear-gradient(135deg, #6366f1, var(--accent-2)); border: none; color: #fff; font-weight: 600; }
    button.danger { color: var(--bad); }
    button.danger:hover:not(:disabled) { border-color: var(--bad); }

    .keybar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; }
    .keybar input { flex: 1 1 220px; max-width: 340px; }
    .mode { font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .mode.locked { color: var(--warn); background: var(--warn-bg); }
    .mode.unlocked { color: var(--ok); background: var(--ok-bg); }
    .keyhint { font-size: .8rem; color: var(--muted); }

    .layout { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
    .list-head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
    .list-head input { flex: 1; min-width: 0; }
    .notes { list-style: none; max-height: 62vh; overflow-y: auto; }
    .note-item { display: block; width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; padding: 12px 14px; }
    .note-item:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border); }
    .note-item.selected { background: var(--selected); }
    .note-title { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note-snippet { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .note-date { color: var(--faint); font-size: .72rem; margin-top: 4px; }
    .list-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: .9rem; }

    .editor { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .editor input { font-size: 1.1rem; font-weight: 600; }
    .editor textarea { min-height: 46vh; padding: 12px; resize: vertical; line-height: 1.6; }
    .editor-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .meta { font-size: .78rem; color: var(--muted); }
    .dirty { color: var(--warn); }
    .placeholder { padding: 48px 16px; text-align: center; color: var(--muted); }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; transition: all .2s; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-size: .9rem; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--bad); color: var(--bad); }
    footer { margin-top: 32px; text-align: center; color: var(--faint); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">← Bifrost dashboard</a>
    <header>
      <div>
        <h1>Notes</h1>
        <p class="tagline">Notes stored in Neon Postgres. Anyone can read; editing needs the API key.</p>
      </div>
    </header>

    <form class="keybar" id="keyForm" autocomplete="off">
      <span class="mode locked" id="mode">Read-only</span>
      <input id="keyInput" type="password" placeholder="X-API-Key to enable editing" aria-label="API key">
      <button type="submit" id="keySave">Unlock</button>
      <button type="button" id="keyClear" hidden>Lock</button>
      <span class="keyhint" id="keyHint">The key is kept only in this browser.</span>
    </form>

    <div class="layout">
      <aside class="panel">
        <div class="list-head">
          <input id="search" type="search" placeholder="Search notes…" aria-label="Search notes">
          <button type="button" class="primary" id="newBtn">New</button>
        </div>
        <ul class="notes" id="notes"><li class="list-empty">Loading notes…</li></ul>
      </aside>

      <main class="panel" id="editorPanel">
        <div class="placeholder" id="placeholder">Select a note, or create a new one.</div>
        <form class="editor" id="editor" hidden>
          <input id="title" maxlength="200" placeholder="Title" aria-label="Title" required>
          <textarea id="content" maxlength="50000" placeholder="Write something…" aria-label="Content"></textarea>
          <div class="editor-foot">
            <span class="meta" id="meta"></span>
            <div class="actions">
              <button type="button" class="danger" id="deleteBtn">Delete</button>
              <button type="submit" class="primary" id="saveBtn">Save</button>
            </div>
          </div>
        </form>
      </main>
    </div>

    <footer>Part of <a href="/">Bifrost</a> · <a href="/notes/docs">API docs</a></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const KEY_STORAGE = 'bifrost-notes-api-key';
  const $ = id => document.getElementById(id);
  const state = { notes: [], selectedId: null, isNew: false, dirty: false, key: '' };

  // Browser storage can be unavailable (private mode, blocked site data) — the UI still works without it
  function readStoredKey() { try { return localStorage.getItem(KEY_STORAGE) || ''; } catch { return ''; } }
  function storeKey(value) { try { value ? localStorage.setItem(KEY_STORAGE, value) : localStorage.removeItem(KEY_STORAGE); } catch {} }

  let toastTimer;
  function toast(message, isError = false) {
    const t = $('toast');
    t.textContent = message;
    t.classList.toggle('error', isError);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  }

  function setKey(value) {
    state.key = value;
    storeKey(value);
    const unlocked = Boolean(value);
    $('mode').textContent = unlocked ? 'Editing enabled' : 'Read-only';
    $('mode').className = `mode ${unlocked ? 'unlocked' : 'locked'}`;
    $('keyInput').hidden = unlocked;
    $('keySave').hidden = unlocked;
    $('keyClear').hidden = !unlocked;
    $('keyHint').textContent = unlocked ? 'Key saved in this browser only.' : 'The key is kept only in this browser.';
    $('newBtn').disabled = !unlocked;
    $('newBtn').title = unlocked ? '' : 'Unlock with the API key to create notes';
    syncEditorLock();
  }

  function syncEditorLock() {
    const locked = !state.key;
    $('title').readOnly = locked;
    $('content').readOnly = locked;
    $('saveBtn').disabled = locked || !state.dirty;
    $('deleteBtn').disabled = locked || state.isNew;
    $('deleteBtn').hidden = state.isNew;
  }

  async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (state.key && options.method && options.method !== 'GET') headers['X-API-Key'] = state.key;
    const res = await fetch(path, { ...options, headers });
    if (res.status === 401) {
      setKey('');
      throw new Error('That API key was rejected — editing is locked again.');
    }
    if (res.status === 503) throw new Error('The notes database is not available right now.');
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(typeof data.detail === 'string' ? data.detail : `Request failed (${res.status})`);
    }
    return res.status === 204 ? null : res.json();
  }

  function renderList() {
    const query = $('search').value.trim().toLowerCase();
    const visible = state.notes.filter(n => !query || `${n.title} ${n.content}`.toLowerCase().includes(query));
    const list = $('notes');
    if (!visible.length) {
      const msg = state.notes.length ? 'No notes match your search.' : (state.key ? 'No notes yet — create the first one.' : 'No notes yet.');
      list.replaceChildren(Object.assign(document.createElement('li'), { className: 'list-empty', textContent: msg }));
      return;
    }
    // Note text is user content: textContent only, never innerHTML
    list.replaceChildren(...visible.map(note => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `note-item${note.id === state.selectedId ? ' selected' : ''}`;
      const title = Object.assign(document.createElement('div'), { className: 'note-title', textContent: note.title });
      const snippet = Object.assign(document.createElement('div'), { className: 'note-snippet', textContent: note.content.slice(0, 120) || 'Empty note' });
      const date = Object.assign(document.createElement('div'), { className: 'note-date', textContent: formatDate(note.updated_at) });
      btn.append(title, snippet, date);
      btn.addEventListener('click', () => selectNote(note.id));
      li.append(btn);
      return li;
    }));
  }

  function confirmDiscard() {
    return !state.dirty || confirm('You have unsaved changes. Discard them?');
  }

  function openEditor(note) {
    $('placeholder').hidden = true;
    $('editor').hidden = false;
    $('title').value = note ? note.title : '';
    $('content').value = note ? note.content : '';
    state.dirty = false;
    updateMeta(note);
    syncEditorLock();
  }

  function updateMeta(note) {
    const meta = $('meta');
    if (state.dirty) { meta.textContent = 'Unsaved changes'; meta.className = 'meta dirty'; return; }
    meta.className = 'meta';
    meta.textContent = note
      ? `Updated ${formatDate(note.updated_at)} · created ${formatDate(note.created_at)}`
      : 'New note — not saved yet';
  }

  function currentNote() { return state.notes.find(n => n.id === state.selectedId) || null; }

  function selectNote(id) {
    if (id === state.selectedId || !confirmDiscard()) return;
    state.selectedId = id;
    state.isNew = false;
    openEditor(currentNote());
    renderList();
  }

  function newNote() {
    if (!confirmDiscard()) return;
    state.selectedId = null;
    state.isNew = true;
    openEditor(null);
    renderList();
    $('title').focus();
  }

  async function save(event) {
    event?.preventDefault();
    if (!state.key || !state.dirty) return;
    const body = JSON.stringify({ title: $('title').value.trim(), content: $('content').value });
    if (!$('title').value.trim()) return toast('Give the note a title first.', true);
    $('saveBtn').disabled = true;
    try {
      const saved = state.isNew
        ? await api('/notes', { method: 'POST', body })
        : await api(`/notes/${encodeURIComponent(state.selectedId)}`, { method: 'PUT', body });
      state.notes = [saved, ...state.notes.filter(n => n.id !== saved.id)];
      state.selectedId = saved.id;
      state.isNew = false;
      state.dirty = false;
      updateMeta(saved);
      renderList();
      toast('Saved');
    } catch (err) {
      toast(err.message, true);
    } finally {
      syncEditorLock();
    }
  }

  async function remove() {
    const note = currentNote();
    if (!note || !confirm(`Delete “${note.title}”? This can't be undone.`)) return;
    try {
      await api(`/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
      state.notes = state.notes.filter(n => n.id !== note.id);
      state.selectedId = null;
      state.dirty = false;
      $('editor').hidden = true;
      $('placeholder').hidden = false;
      renderList();
      toast('Note deleted');
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function load() {
    try {
      state.notes = await api('/notes');
      renderList();
    } catch (err) {
      $('notes').replaceChildren(Object.assign(document.createElement('li'), { className: 'list-empty', textContent: err.message }));
    }
  }

  function markDirty() {
    if (!state.key) return;
    state.dirty = true;
    updateMeta(currentNote());
    syncEditorLock();
  }

  $('keyForm').addEventListener('submit', e => {
    e.preventDefault();
    const value = $('keyInput').value.trim();
    if (!value) return toast('Enter the API key first.', true);
    $('keyInput').value = '';
    setKey(value);
    toast('Editing enabled — the key is checked on your first save.');
  });
  $('keyClear').addEventListener('click', () => { setKey(''); toast('Editing locked'); });
  $('search').addEventListener('input', renderList);
  $('newBtn').addEventListener('click', newNote);
  $('editor').addEventListener('submit', save);
  $('deleteBtn').addEventListener('click', remove);
  $('title').addEventListener('input', markDirty);
  $('content').addEventListener('input', markDirty);
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's' && !$('editor').hidden) { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', e => { if (state.dirty) e.preventDefault(); });

  setKey(readStoredKey());
  load();
</script>
</body>
</html>
